# Build check for pull requests and pushes to main.
# Runs the same build as a deploy (prebuild SEO fallback guard, then vite build)
# plus a TypeScript check, since vite build does not type check.
# It never deploys: FTP credentials (scripts/ftp-config.json) are gitignored and not needed here.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No .nvmrc or engines field in the repo, so Node 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      # prebuild runs scripts/check-seo-fallback.js, then vite build.
      - name: Build
        run: npm run build
