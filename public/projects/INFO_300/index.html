    <!--
      This page dynamically loads the React app's assets from the main index.html.
      This prevents breakage when asset hashes change on rebuild.
      Social media crawlers still see the OG meta tags above.
    -->
    <script>
      fetch('/')
        .then(function(r) { return r.text(); })
        .then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');

          // Load CSS
          doc.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
            var el = document.createElement('link');
            el.rel = 'stylesheet';
            el.href = link.getAttribute('href');
            document.head.appendChild(el);
          });

          // Load JS modules
          doc.querySelectorAll('script[type="module"]').forEach(function(script) {
            var el = document.createElement('script');
            el.type = 'module';
            el.crossOrigin = '';
            el.src = script.getAttribute('src');
            document.body.appendChild(el);
          });
        });
    </script>

    <div id="root"></div>
